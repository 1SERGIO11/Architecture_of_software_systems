<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #374151; }
      .actor { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; rx: 10; }
      .actor-text { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .life { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .msg { stroke: #1e293b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #475569; stroke-width: 1.9; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow2); }
      .note { font: 500 12px Arial, sans-serif; fill: #1f2937; }
      .step { font: 600 12px Arial, sans-serif; fill: #334155; }
      .bg { fill: #f8fafc; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow2" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" class="bg"/>
  <text x="34" y="52" class="title">Lab Work 3 - Sequence Diagram</text>
  <text x="34" y="80" class="subtitle">Scenario: staff updates order status, customer receives notification</text>

  <g transform="translate(0,0)">
    <rect x="60" y="120" width="170" height="52" class="actor"/><text x="78" y="151" class="actor-text">Store Panel</text>
    <rect x="300" y="120" width="190" height="52" class="actor"/><text x="323" y="151" class="actor-text">API Controller</text>
    <rect x="560" y="120" width="210" height="52" class="actor"/><text x="584" y="151" class="actor-text">OrderStatusService</text>
    <rect x="860" y="120" width="190" height="52" class="actor"/><text x="890" y="151" class="actor-text">Repository</text>
    <rect x="1110" y="120" width="190" height="52" class="actor"/><text x="1145" y="151" class="actor-text">Rules</text>
    <rect x="1360" y="120" width="190" height="52" class="actor"/><text x="1383" y="151" class="actor-text">Notification Dispatcher</text>

    <line x1="145" y1="172" x2="145" y2="915" class="life"/>
    <line x1="395" y1="172" x2="395" y2="915" class="life"/>
    <line x1="665" y1="172" x2="665" y2="915" class="life"/>
    <line x1="955" y1="172" x2="955" y2="915" class="life"/>
    <line x1="1205" y1="172" x2="1205" y2="915" class="life"/>
    <line x1="1455" y1="172" x2="1455" y2="915" class="life"/>

    <path d="M145 230 L395 230" class="msg"/>
    <text x="160" y="220" class="note">POST /orders/{id}/status</text>
    <text x="124" y="234" class="step">1</text>

    <path d="M395 280 L665 280" class="msg"/>
    <text x="420" y="270" class="note">update_status(order_id, new_status)</text>
    <text x="374" y="284" class="step">2</text>

    <path d="M665 335 L955 335" class="msg"/>
    <text x="700" y="325" class="note">get(order_id)</text>
    <text x="644" y="339" class="step">3</text>

    <path d="M955 365 L665 365" class="ret"/>
    <text x="770" y="354" class="note">Order</text>

    <path d="M665 420 L1205 420" class="msg"/>
    <text x="740" y="410" class="note">ensure_transition_allowed(...)</text>
    <text x="644" y="424" class="step">4</text>

    <path d="M1205 450 L665 450" class="ret"/>
    <text x="900" y="440" class="note">OK</text>

    <text x="690" y="505" class="note">order.advance_to(new_status)</text>
    <text x="644" y="509" class="step">5</text>

    <path d="M665 560 L955 560" class="msg"/>
    <text x="735" y="550" class="note">save(order)</text>
    <text x="644" y="564" class="step">6</text>

    <path d="M665 625 L1455 625" class="msg"/>
    <text x="780" y="615" class="note">dispatch_status_changed(order)</text>
    <text x="644" y="629" class="step">7</text>

    <text x="1330" y="680" class="note">send push/email</text>

    <path d="M1455 715 L665 715" class="ret"/>
    <text x="980" y="704" class="note">notifications[]</text>

    <path d="M665 780 L395 780" class="ret"/>
    <text x="485" y="770" class="note">StatusUpdateResult</text>
    <text x="644" y="784" class="step">8</text>

    <path d="M395 845 L145 845" class="ret"/>
    <text x="224" y="834" class="note">200 OK + updated order</text>
    <text x="374" y="849" class="step">9</text>
  </g>
</svg>
