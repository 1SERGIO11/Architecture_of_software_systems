<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="984" height="364"/>
<text class="title" x="22" y="32">Decorator: AuditNotificationDecorator</text>
<rect class="box" x="380" y="35" width="280" height="110" />
<text class="meta" x="390" y="53">&lt;&lt;interface&gt;&gt;</text>
<text class="title" x="390" y="73">NotificationChannel</text>
<line class="rel" x1="380" y1="81" x2="660" y2="81"/>
<text class="text" x="390" y="99">+ send(recipient, message): str</text>
<rect class="box" x="120" y="180" width="330" height="140" />
<text class="title" x="130" y="204">NotificationChannelDecorator</text>
<line class="rel" x1="120" y1="212" x2="450" y2="212"/>
<text class="text" x="130" y="230">- wrapped: NotificationChannel</text>
<text class="text" x="130" y="246">+ send(recipient, message): str</text>
<rect class="box" x="540" y="180" width="330" height="130" />
<text class="title" x="550" y="204">AuditNotificationDecorator</text>
<line class="rel" x1="540" y1="212" x2="870" y2="212"/>
<text class="text" x="550" y="230">- audit_log: list[str]</text>
<text class="text" x="550" y="246">+ send(recipient, message): str</text>
<line class="rel-dashed" x1="285" y1="180" x2="470" y2="145" marker-end="url(#triangle)"/>
<line class="rel" x1="705" y1="180" x2="560" y2="145" marker-end="url(#triangle)"/>
<line class="rel" x1="540" y1="245" x2="450" y2="245" marker-end="url(#arrow)"/>
<text class="small" x="495.0" y="239.0">extends/wraps</text>
</svg>
