<svg xmlns="http://www.w3.org/2000/svg" width="980" height="410" viewBox="0 0 980 410">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="964" height="394"/>
<text class="title" x="22" y="32">Proxy: CustomerRepositoryCacheProxy</text>
<rect class="box" x="360" y="35" width="300" height="110" />
<text class="meta" x="370" y="53">&lt;&lt;interface&gt;&gt;</text>
<text class="title" x="370" y="73">CustomerRepository</text>
<line class="rel" x1="360" y1="81" x2="660" y2="81"/>
<text class="text" x="370" y="99">+ add(customer)</text>
<text class="text" x="370" y="115">+ get(customer_id)</text>
<text class="text" x="370" y="131">+ list()</text>
<rect class="box" x="70" y="190" width="310" height="140" />
<text class="title" x="80" y="214">InMemoryCustomerRepository</text>
<line class="rel" x1="70" y1="222" x2="380" y2="222"/>
<text class="text" x="80" y="240">+ add(customer)</text>
<text class="text" x="80" y="256">+ get(customer_id)</text>
<text class="text" x="80" y="272">+ list()</text>
<rect class="box" x="470" y="190" width="420" height="160" />
<text class="title" x="480" y="214">CustomerRepositoryCacheProxy</text>
<line class="rel" x1="470" y1="222" x2="890" y2="222"/>
<text class="text" x="480" y="240">- origin: CustomerRepository</text>
<text class="text" x="480" y="256">- cache: dict</text>
<text class="text" x="480" y="272">+ cache_hits: int</text>
<text class="text" x="480" y="288">+ get(customer_id)</text>
<line class="rel-dashed" x1="225" y1="190" x2="460" y2="145" marker-end="url(#triangle)"/>
<line class="rel-dashed" x1="680" y1="190" x2="560" y2="145" marker-end="url(#triangle)"/>
<line class="rel" x1="470" y1="268" x2="380" y2="260" marker-end="url(#arrow)"/>
<text class="small" x="425.0" y="258.0">forwards to origin</text>
</svg>
