<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="964" height="364"/>
<text class="title" x="22" y="32">Builder: OrderBuilder</text>
<rect class="box" x="70" y="70" width="390" height="250" />
<text class="title" x="80" y="94">OrderBuilder</text>
<line class="rel" x1="70" y1="102" x2="460" y2="102"/>
<text class="text" x="80" y="120">+ with_order_id(id): OrderBuilder</text>
<text class="text" x="80" y="136">+ with_customer_id(id): OrderBuilder</text>
<text class="text" x="80" y="152">+ with_store_id(id): OrderBuilder</text>
<text class="text" x="80" y="168">+ with_fulfillment(type): OrderBuilder</text>
<text class="text" x="80" y="184">+ with_amount(value): OrderBuilder</text>
<text class="text" x="80" y="200">+ build(): Order</text>
<rect class="box" x="560" y="95" width="350" height="210" />
<text class="title" x="570" y="119">Order</text>
<line class="rel" x1="560" y1="127" x2="910" y2="127"/>
<text class="text" x="570" y="145">+ order_id: str</text>
<text class="text" x="570" y="161">+ customer_id: str</text>
<text class="text" x="570" y="177">+ fulfillment: FulfillmentType</text>
<text class="text" x="570" y="193">+ base_amount: float</text>
<text class="text" x="570" y="209">+ final_amount: float</text>
<line class="rel" x1="460" y1="190" x2="560" y2="190" marker-end="url(#arrow)"/>
<text class="small" x="510.0" y="184.0">build()</text>
</svg>
