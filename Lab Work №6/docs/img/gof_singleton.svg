<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="964" height="324"/>
<text class="title" x="22" y="32">Singleton: AppConfig</text>
<rect class="box" x="220" y="70" width="460" height="220" />
<text class="meta" x="230" y="88">&lt;&lt;Singleton&gt;&gt;</text>
<text class="title" x="230" y="108">AppConfig</text>
<line class="rel" x1="220" y1="116" x2="680" y2="116"/>
<text class="text" x="230" y="134">- _instance: AppConfig</text>
<text class="text" x="230" y="150">+ delivery_fee: float</text>
<text class="text" x="230" y="166">+ currency: str</text>
<text class="text" x="230" y="182">+ __new__(): AppConfig</text>
<line class="rel" x1="680" y1="130" x2="760" y2="130" marker-end="url(#arrow)"/>
<text class="small" x="720.0" y="124.0">stores unique instance</text>
<rect class="box" x="760" y="98" width="180" height="64"/>
<text class="text" x="772" y="124">instance: AppConfig</text>
</svg>
