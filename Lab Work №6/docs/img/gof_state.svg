<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="984" height="444"/>
<text class="title" x="22" y="32">State: OrderStateMachine</text>
<rect class="box" x="380" y="40" width="280" height="110" />
<text class="meta" x="390" y="58">&lt;&lt;abstract&gt;&gt;</text>
<text class="title" x="390" y="78">OrderState</text>
<line class="rel" x1="380" y1="86" x2="660" y2="86"/>
<text class="text" x="390" y="104">+ next_statuses(fulfillment): set[OrderStatus]</text>
<rect class="box" x="60" y="200" width="200" height="90" />
<text class="title" x="70" y="224">PlacedState</text>
<line class="rel" x1="60" y1="232" x2="260" y2="232"/>
<rect class="box" x="280" y="200" width="200" height="90" />
<text class="title" x="290" y="224">InPreparationState</text>
<line class="rel" x1="280" y1="232" x2="480" y2="232"/>
<rect class="box" x="500" y="200" width="200" height="90" />
<text class="title" x="510" y="224">ReadyForPickupState</text>
<line class="rel" x1="500" y1="232" x2="700" y2="232"/>
<rect class="box" x="720" y="200" width="200" height="90" />
<text class="title" x="730" y="224">OutForDeliveryState</text>
<line class="rel" x1="720" y1="232" x2="920" y2="232"/>
<rect class="box" x="280" y="320" width="200" height="90" />
<text class="title" x="290" y="344">DeliveredState</text>
<line class="rel" x1="280" y1="352" x2="480" y2="352"/>
<rect class="box" x="500" y="320" width="200" height="90" />
<text class="title" x="510" y="344">CancelledState</text>
<line class="rel" x1="500" y1="352" x2="700" y2="352"/>
<rect class="box" x="60" y="330" width="200" height="90" />
<text class="title" x="70" y="354">OrderStateMachine</text>
<line class="rel" x1="60" y1="362" x2="260" y2="362"/>
<text class="text" x="70" y="380">+ transition(order, target)</text>
<line class="rel" x1="160" y1="200" x2="470" y2="150" marker-end="url(#triangle)"/>
<line class="rel" x1="380" y1="200" x2="500" y2="150" marker-end="url(#triangle)"/>
<line class="rel" x1="600" y1="200" x2="540" y2="150" marker-end="url(#triangle)"/>
<line class="rel" x1="820" y1="200" x2="570" y2="150" marker-end="url(#triangle)"/>
<line class="rel" x1="380" y1="320" x2="500" y2="150" marker-end="url(#triangle)"/>
<line class="rel" x1="600" y1="320" x2="540" y2="150" marker-end="url(#triangle)"/>
<line class="rel" x1="260" y1="375" x2="380" y2="375" marker-end="url(#arrow)"/>
<text class="small" x="320.0" y="369.0">uses current state</text>
</svg>
