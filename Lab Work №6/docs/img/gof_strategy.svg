<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="500" viewBox="0 0 1030 500">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="1014" height="484"/>
<text class="title" x="22" y="32">Strategy: Pricing</text>
<rect class="box" x="370" y="30" width="270" height="110" />
<text class="meta" x="380" y="48">&lt;&lt;interface&gt;&gt;</text>
<text class="title" x="380" y="68">PricingStrategy</text>
<line class="rel" x1="370" y1="76" x2="640" y2="76"/>
<text class="text" x="380" y="94">+ calculate(base_amount): float</text>
<rect class="box" x="90" y="190" width="300" height="110" />
<text class="title" x="100" y="214">PickupPricingStrategy</text>
<line class="rel" x1="90" y1="222" x2="390" y2="222"/>
<text class="text" x="100" y="240">+ calculate(base_amount): float</text>
<rect class="box" x="620" y="190" width="300" height="125" />
<text class="title" x="630" y="214">DeliveryPricingStrategy</text>
<line class="rel" x1="620" y1="222" x2="920" y2="222"/>
<text class="text" x="630" y="240">- delivery_fee: float</text>
<text class="text" x="630" y="256">+ calculate(base_amount): float</text>
<rect class="box" x="350" y="340" width="320" height="110" />
<text class="title" x="360" y="364">OrderManagementFacade</text>
<line class="rel" x1="350" y1="372" x2="670" y2="372"/>
<text class="text" x="360" y="390">- pricing: dict[FulfillmentType, PricingStrategy]</text>
<line class="rel-dashed" x1="240" y1="190" x2="460" y2="140" marker-end="url(#triangle)"/>
<line class="rel-dashed" x1="770" y1="190" x2="560" y2="140" marker-end="url(#triangle)"/>
<line class="rel" x1="510" y1="340" x2="510" y2="305" marker-end="url(#arrow)"/>
<text class="small" x="510.0" y="316.5">uses strategy</text>
</svg>
