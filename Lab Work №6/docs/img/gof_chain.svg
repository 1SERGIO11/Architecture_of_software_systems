<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="1024" height="364"/>
<text class="title" x="22" y="32">Chain of Responsibility: Validation</text>
<rect class="box" x="360" y="35" width="300" height="120" />
<text class="meta" x="370" y="53">&lt;&lt;abstract&gt;&gt;</text>
<text class="title" x="370" y="73">ValidationHandler</text>
<line class="rel" x1="360" y1="81" x2="660" y2="81"/>
<text class="text" x="370" y="99">- next: ValidationHandler</text>
<text class="text" x="370" y="115">+ set_next(handler)</text>
<text class="text" x="370" y="131">+ handle(context)</text>
<rect class="box" x="70" y="230" width="270" height="90" />
<text class="title" x="80" y="254">CustomerExistsValidator</text>
<line class="rel" x1="70" y1="262" x2="340" y2="262"/>
<rect class="box" x="380" y="230" width="260" height="90" />
<text class="title" x="390" y="254">PositiveAmountValidator</text>
<line class="rel" x1="380" y1="262" x2="640" y2="262"/>
<rect class="box" x="680" y="230" width="280" height="90" />
<text class="title" x="690" y="254">StatusTransitionValidator</text>
<line class="rel" x1="680" y1="262" x2="960" y2="262"/>
<line class="rel" x1="205" y1="230" x2="470" y2="155" marker-end="url(#triangle)"/>
<line class="rel" x1="510" y1="230" x2="510" y2="155" marker-end="url(#triangle)"/>
<line class="rel" x1="820" y1="230" x2="560" y2="155" marker-end="url(#triangle)"/>
<line class="rel" x1="340" y1="275" x2="380" y2="275" marker-end="url(#arrow)"/>
<text class="small" x="360.0" y="269.0">next</text>
<line class="rel" x1="640" y1="275" x2="680" y2="275" marker-end="url(#arrow)"/>
<text class="small" x="660.0" y="269.0">next</text>
</svg>
