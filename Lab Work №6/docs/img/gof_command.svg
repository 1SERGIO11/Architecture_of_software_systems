<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="640" viewBox="0 0 1020 640">

<style>
.bg { fill: #ffffff; }
.frame { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
.box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; ry: 8; }
.title { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
.meta { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.text { font: 12px 'Consolas', 'Courier New', monospace; fill: #1e293b; }
.small { font: 11px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.rel { stroke: #0f172a; stroke-width: 1.5; fill: none; }
.rel-dashed { stroke: #0f172a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
  </marker>
  <marker id="triangle" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M 1 1 L 12 7 L 1 13 z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="frame" x="8" y="8" width="1004" height="624"/>
<text class="title" x="22" y="32">Command: Create/Change Status</text>
<rect class="box" x="390" y="35" width="260" height="110" />
<text class="meta" x="400" y="53">&lt;&lt;interface&gt;&gt;</text>
<text class="title" x="400" y="73">Command</text>
<line class="rel" x1="390" y1="81" x2="650" y2="81"/>
<text class="text" x="400" y="99">+ execute(): object</text>
<rect class="box" x="80" y="190" width="300" height="120" />
<text class="title" x="90" y="214">CreateOrderCommand</text>
<line class="rel" x1="80" y1="222" x2="380" y2="222"/>
<text class="text" x="90" y="240">- facade: OrderManagementFacade</text>
<text class="text" x="90" y="256">+ execute(): Order</text>
<rect class="box" x="620" y="190" width="300" height="120" />
<text class="title" x="630" y="214">ChangeStatusCommand</text>
<line class="rel" x1="620" y1="222" x2="920" y2="222"/>
<text class="text" x="630" y="240">- facade: OrderManagementFacade</text>
<text class="text" x="630" y="256">+ execute(): Order</text>
<rect class="box" x="390" y="350" width="260" height="100" />
<text class="title" x="400" y="374">CommandBus</text>
<line class="rel" x1="390" y1="382" x2="650" y2="382"/>
<text class="text" x="400" y="400">+ execute(command): object</text>
<rect class="box" x="390" y="500" width="260" height="100" />
<text class="title" x="400" y="524">OrderManagementFacade</text>
<line class="rel" x1="390" y1="532" x2="650" y2="532"/>
<text class="text" x="400" y="550">+ create_order()</text>
<text class="text" x="400" y="566">+ change_order_status()</text>
<line class="rel-dashed" x1="230" y1="190" x2="470" y2="145" marker-end="url(#triangle)"/>
<line class="rel-dashed" x1="770" y1="190" x2="560" y2="145" marker-end="url(#triangle)"/>
<line class="rel" x1="520" y1="350" x2="230" y2="310" marker-end="url(#arrow)"/>
<text class="small" x="375.0" y="324.0">invokes</text>
<line class="rel" x1="520" y1="350" x2="770" y2="310" marker-end="url(#arrow)"/>
<text class="small" x="645.0" y="324.0">invokes</text>
<line class="rel" x1="230" y1="310" x2="460" y2="500" marker-end="url(#arrow)"/>
<text class="small" x="345.0" y="399.0">receiver</text>
<line class="rel" x1="770" y1="310" x2="580" y2="500" marker-end="url(#arrow)"/>
<text class="small" x="675.0" y="399.0">receiver</text>
</svg>
