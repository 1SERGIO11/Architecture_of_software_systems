services:
  db:
    image: postgres:16-alpine
    container_name: sandwich-db
    environment:
      POSTGRES_DB: sandwich
      POSTGRES_USER: sandwich
      POSTGRES_PASSWORD: sandwich
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandwich -d sandwich"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sandwich-net

  backend:
    build:
      context: ./backend
    container_name: sandwich-backend
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sandwich
      DB_USER: sandwich
      DB_PASSWORD: sandwich
      DB_SSLMODE: disable
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/api/v1/health').status==200 else sys.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sandwich-net

  client:
    build:
      context: ./client
    container_name: sandwich-client
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sandwich-net

volumes:
  db_data:

networks:
  sandwich-net:
    driver: bridge
